<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess The Number</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101827;
    font-family: Arial, sans-serif;
    color: white;
}
.game {
    background: #1e293b;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    width: 380px;
    max-width: 95%;
    box-shadow: 0 10px 40px #0005;
}
h1 { color: #a78bfa; }
.stats {
    display: flex;
    justify-content: space-around;
    margin: 25px 0;
}
.stats div {
    background: #334155;
    padding: 15px 25px;
    border-radius: 12px;
}
input {
    padding: 12px;
    width: 130px;
    border: none;
    border-radius: 8px;
    text-align: center;
    font-size: 20px;
}
button {
    background: #7c3aed;
    color: white;
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    margin: 8px;
    font-size: 16px;
}
button:hover { background: #6d28d9; }
button:disabled { opacity: .5; cursor: default; }
#message { min-height: 45px; color: #4ade80; }
</style>
</head>
<body>
<div class="game">
    <h1>🎮 Guess The Number</h1>
    <p>Угадай число от 1 до 20</p>

    <div class="stats">
        <div>Попытки<br><h2 id="attempts">0</h2></div>
        <div>Очки<br><h2 id="score">0</h2></div>
    </div>

    <input type="number" id="guess" min="1" max="20"
           placeholder="1-20">
    <br>
    <button id="checkBtn" onclick="check()">Проверить</button>
    <button onclick="newGame()">Новая игра</button>
    <p id="message">Введи число!</p>
    <p>Оңланбай Асқар | СРО 3</p>
</div>

<script>
let secret = Math.floor(Math.random() * 20) + 1;
let attempts = 0;
let score = 0;
let won = false;

function check() {
    if (won) return;

    const value = document.getElementById("guess").value;
    const num = Number(value);
    const msg = document.getElementById("message");

    if (value.trim() === "" ||
        !Number.isInteger(num) || num < 1 || num > 20) {
        msg.textContent = "Введи число от 1 до 20!";
        return;
    }

    attempts++;
    document.getElementById("attempts").textContent = attempts;

    if (num === secret) {
        score += Math.max(10, 110 - attempts * 10);
        document.getElementById("score").textContent = score;
        msg.textContent = "🎉 Победа! Ты угадал!";
        won = true;
        document.getElementById("checkBtn").disabled = true;
    } else if (num < secret) {
        msg.textContent = "📈 Число больше!";
    } else {
        msg.textContent = "📉 Число меньше!";
    }
}

function newGame() {
    secret = Math.floor(Math.random() * 20) + 1;
    attempts = 0;
    won = false;
    document.getElementById("attempts").textContent = 0;
    document.getElementById("guess").value = "";
    document.getElementById("message").textContent =
        "Новая игра! Угадай число.";
    document.getElementById("checkBtn").disabled = false;
}
</script>
</body>
</html>
